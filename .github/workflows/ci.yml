name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  backend-ci:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend/ApartmentManagement.Api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

  frontend-ci:
    name: Build & Test Frontend (React)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./web/apartment-management-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'
          cache-dependency-path: './web/apartment-management-web/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test --if-present

  safety-agent-ci:
    name: Test Validation & Safety Agent (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./agent-services/safety-agent

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './agent-services/safety-agent/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  onboarding-agent-ci:
    name: Test Resident Onboarding Agent (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./agent-services/onboarding-agent

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './agent-services/onboarding-agent/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
